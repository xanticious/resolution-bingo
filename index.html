<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Resolution Bingo - Gamify your New Year's resolutions with customizable bingo cards">
  <title>Resolution Bingo</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://openmoji.org/data/color/svg/1F3AF.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Open+Sans:wght@400;600&family=Patrick+Hand&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/print.css">
</head>

<body>
  <!-- Header Navigation -->
  <header id="app-header" class="app-header">
    <div class="header-container">
      <div class="header-left">
        <h1 class="app-logo">
          <img src="https://openmoji.org/data/color/svg/1F3AF.svg" alt="target" class="openmoji" width="72" height="72"
            style="width: 1.5em; height: 1.5em; display: inline-block; vertical-align: middle; margin-right: 0.25em;">
          Resolution Bingo
        </h1>
        <div class="profile-indicator" id="profile-indicator" data-testid="profile-indicator">
          <span id="profile-name">Loading...</span>
          <div class="profile-dropdown" id="profile-dropdown" data-testid="profile-dropdown">
            <!-- Profile options will be populated by JavaScript -->
          </div>
        </div>
      </div>
      <nav class="main-nav">
        <a href="#/" class="nav-link active" data-page="resolutions">Resolutions</a>
        <a href="#/bingo-cards" class="nav-link" data-page="bingo-cards">My Bingo Cards</a>
        <a href="#/settings" class="nav-link" data-page="settings">Settings</a>
        <a href="#/help" class="nav-link" data-page="help">Help</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-main" class="app-main">
    <!-- Dynamic content will be loaded here -->
  </main>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
